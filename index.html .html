<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダイエットノート</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff8fb;--card:#fff;--ink:#4a2f3a;--sub:#a07f8c;--pink:#ee7ea4;--pink2:#f7b3cb;--soft:#fff0f5;--line:#fbe3ec;--warn:#fff3c4;--warnt:#7a5a00;--bad:#ffd9de;--badt:#a3122e}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#3b1f2b;--ink:#ffe8f0;--sub:#d9a3b8;--soft:#52293a;--line:#6a3548;--warn:#5a4a12;--warnt:#ffe9a0;--bad:#6a1d2c;--badt:#ffc9d2}}
:root[data-theme="dark"]{--bg:#2a1620;--card:#3b1f2b;--ink:#ffe8f0;--sub:#d9a3b8;--soft:#52293a;--line:#6a3548;--warn:#5a4a12;--warnt:#ffe9a0;--bad:#6a1d2c;--badt:#ffc9d2}
html[data-c="blue"]:not([data-x]){--pink:#6fa3e8;--pink2:#a9c9f3;--soft:color-mix(in srgb,var(--pink) 12%,var(--card));--line:color-mix(in srgb,var(--pink) 24%,var(--card));--bg:color-mix(in srgb,var(--pink) 7%,var(--card))}
html[data-c="green"]:not([data-x]){--pink:#5fba8c;--pink2:#a3dcc0;--soft:color-mix(in srgb,var(--pink) 12%,var(--card));--line:color-mix(in srgb,var(--pink) 24%,var(--card));--bg:color-mix(in srgb,var(--pink) 7%,var(--card))}
html[data-c="purple"]:not([data-x]){--pink:#a98be0;--pink2:#cdbcf0;--soft:color-mix(in srgb,var(--pink) 12%,var(--card));--line:color-mix(in srgb,var(--pink) 24%,var(--card));--bg:color-mix(in srgb,var(--pink) 7%,var(--card))}
html[data-c="orange"]:not([data-x]){--pink:#f0935a;--pink2:#f7c19c;--soft:color-mix(in srgb,var(--pink) 12%,var(--card));--line:color-mix(in srgb,var(--pink) 24%,var(--card));--bg:color-mix(in srgb,var(--pink) 7%,var(--card))}
html[data-c="gray"]:not([data-x]){--pink:#8a97a6;--pink2:#bcc5d0;--soft:color-mix(in srgb,var(--pink) 12%,var(--card));--line:color-mix(in srgb,var(--pink) 24%,var(--card));--bg:color-mix(in srgb,var(--pink) 7%,var(--card))}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;padding:16px;text-align:center;font-size:22px;font-weight:800}
main{max-width:640px;margin:auto;padding:12px 12px 90px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px color-mix(in srgb,var(--pink) 14%,transparent)}
h2{font-size:19px;margin:0 0 12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;padding:10px 0 8px;font-size:12px;color:var(--sub);font-weight:700}
.tabs button span{display:block;font-size:24px}
.tabs button.on{color:var(--pink)}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px;font-weight:700}
input,select{width:100%;padding:12px;font:inherit;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--pink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:800;background:var(--pink);color:#fff;cursor:pointer}
.btn.full{width:100%}.btn.soft{background:var(--soft);color:var(--pink)}.btn.sm{padding:7px 11px;font-size:14px}.btn.bad{background:var(--bad);color:var(--badt)}
.btn:disabled{opacity:.5}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:130px;height:130px;flex:none}
.big{font-size:40px;font-weight:900;color:var(--pink);line-height:1.1}
.sub{color:var(--sub);font-size:14px}
.alert{border-radius:14px;padding:12px;font-weight:800;margin-top:12px}
.alert.w{background:var(--warn);color:var(--warnt)}.alert.b{background:var(--bad);color:var(--badt)}.alert.g{background:var(--soft);color:var(--pink)}
.drop{display:block;border:3px dashed var(--pink2);border-radius:16px;padding:18px;text-align:center;color:var(--pink);font-weight:800;cursor:pointer}
.drop input{display:none}
#pv{max-width:100%;max-height:220px;border-radius:14px;display:none;margin:10px auto 0}
.meal,.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.meal img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.grow{flex:1;min-width:0}
.task input[type=checkbox]{width:28px;height:28px;accent-color:var(--pink);flex:none}
.task.done .nm{text-decoration:line-through;opacity:.5}
.hide{display:none}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.stat div{background:var(--soft);border-radius:14px;padding:10px 4px}.stat b{display:block;font-size:20px;color:var(--pink)}
.note{font-size:13px;color:var(--sub);margin-top:10px}
</style>
</head>
<body>
<header>ダイエットノート</header>
<main>
<section id="t-home">
 <div class="card">
  <h2>🔥 今日のカロリー</h2>
  <div class="ring">
   <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="var(--soft)" stroke-width="14"/><circle id="arc" cx="60" cy="60" r="50" fill="none" stroke="var(--pink)" stroke-width="14" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="22" font-weight="900" fill="var(--pink)" id="pct">0%</text></svg>
   <div><div class="sub">あと食べられる量</div><div class="big"><span id="rem">--</span><span style="font-size:18px"> kcal</span></div><div class="sub">目標 <b id="tg">--</b> / 摂取 <b id="eat">0</b> kcal</div></div>
  </div>
  <div id="al"></div>
 </div>
 <div class="card">
  <h2>📷 食事を記録</h2>
  <label class="drop"><input type="file" id="ph" accept="image/*">📸 撮影 / 写真を選ぶ</label>
  <img id="pv" alt="">
  <button class="btn full" id="an" style="margin-top:12px">🔘 解析してカロリー追加</button>
  <div id="msg" class="note"></div>
  <div id="manual" class="hide"><label>AIが使えない時は手入力</label><div class="g2"><input id="mn" placeholder="料理名"><input id="mk" type="number" placeholder="kcal"></div><button class="btn soft full" id="madd" style="margin-top:8px">＋ 手入力で追加</button></div>
 </div>
 <div class="card"><h2>🍽️ 今日の食事</h2><div id="meals"></div></div>
 <div class="card"><h2>💪 今日の課題</h2><div id="tt"></div></div>
 <div class="card">
  <h2>👣 今日の活動</h2>
  <label style="margin-top:0">歩数（スマホのヘルスケアを見て入力）</label>
  <input type="number" id="steps" inputmode="numeric" placeholder="例：6500">
  <a class="btn full" id="hk" href="x-apple-health://" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:8px">🍎 Appleヘルスケアを開く</a>
  <button class="btn soft full" id="stp" style="margin-top:8px">📲 歩数カウントを開始（アプリを開いている間）</button>
  <div class="note" id="sts"></div>
  <div class="stat"><div><b id="bs">0</b>歩数</div><div><b id="bt">0</b>課題</div><div><b id="bb">0</b>消費kcal</div></div>
  <label class="task" style="margin:8px 0 0;font-weight:700"><input type="checkbox" id="addb"><span>消費分を「食べられる量」に加える</span></label>
  <div class="note">歩数・課題の消費は体重から計算した目安です。</div>
 </div>
</section>

<section id="t-set" class="hide">
 <div class="card"><h2>🎨 カラー</h2><div class="sw" id="sw"><button data-col="pink" style="background:#ee7ea4" aria-label="pink"></button><button data-col="blue" style="background:#6fa3e8" aria-label="blue"></button><button data-col="green" style="background:#5fba8c" aria-label="green"></button><button data-col="purple" style="background:#a98be0" aria-label="purple"></button><button data-col="orange" style="background:#f0935a" aria-label="orange"></button><button data-col="gray" style="background:#8a97a6" aria-label="gray"></button></div></div>
 <div class="card">
  <h2>👤 基本情報</h2>
  <div class="g2">
   <div><label>生年月日</label><input type="date" id="birth"></div>
   <div><label>性別</label><select id="sex"><option value="f">女性</option><option value="m">男性</option></select></div>
   <div><label>身長 (cm)</label><input type="number" id="height" inputmode="decimal"></div>
   <div><label>現在体重 (kg)</label><input type="number" id="weight" step=".1" inputmode="decimal"></div>
   <div><label>目標体重 (kg)</label><input type="number" id="goalW" step=".1" inputmode="decimal"></div>
   <div><label>目標達成日</label><input type="date" id="goalD"></div>
  </div>
  <label>活動量</label>
  <select id="act"><option value="1.2">ほぼ座りっぱなし</option><option value="1.375">軽い活動</option><option value="1.55" selected>ふつう</option><option value="1.725">よく動く</option></select>
  <button class="btn full" id="sv" style="margin-top:14px">💾 保存して計算</button>
 </div>
 <div class="card" id="adv"></div>
</section>

<section id="t-task" class="hide">
 <div class="card"><h2>⭐ おすすめプラン</h2><div id="rec"></div></div>
 <div class="card">
  <h2>💪 1日の課題（最大10）</h2>
  <div class="g2"><input id="tn" placeholder="例：スクワット"><input id="tgl" placeholder="例：20回"></div>
  <button class="btn full" id="ta" style="margin-top:10px">＋ 追加</button>
  <div id="tl" style="margin-top:8px"></div>
 </div>
</section>
</main>
<nav class="tabs">
 <button class="on" data-t="home"><span>🏠</span>今日</button>
 <button data-t="task"><span>💪</span>課題</button>
 <button data-t="set"><span>⚙️</span>設定</button>
</nav>

<script>
const KEY='pinkdiet_v1',$=id=>document.getElementById(id);
let db={p:{},tasks:[],meals:{},done:{}};
try{db=Object.assign(db,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let file=null,sample=null;

function calc(){
 const p=db.p;if(!p.birth||!p.height||!p.weight)return null;
 const b=new Date(p.birth),n=new Date();let age=n.getFullYear()-b.getFullYear();
 if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))age--;
 const w=+p.weight,bmr=10*w+6.25*p.height-5*age+(p.sex==='m'?5:-161),tdee=bmr*(+p.act||1.55);
 const gw=+p.goalW,days=p.goalD?Math.max(1,Math.ceil((new Date(p.goalD+'T00:00')-new Date(td()+'T00:00'))/864e5)):null;
 const need=days&&gw&&gw<w?(w-gw)*7700/days:0;
 const floor=p.sex==='m'?1500:1200,raw=Math.round(tdee-need),kcal=Math.max(floor,raw);
 const real=gw&&gw<w&&tdee-kcal>0?Math.ceil((w-gw)*7700/(tdee-kcal)):null;
 return{age,bmr:Math.round(bmr),tdee:Math.round(tdee),days,need:Math.round(need),kcal,floored:raw<floor,real,gw,w};
}
function render(){
 renderRec();
 const c=calc(),ms=db.meals[td()]||[],eat=ms.reduce((a,m)=>a+m.kcal,0),bn=burn(c);
 $('bs').textContent=bn.stepK;$('bt').textContent=bn.taskK;$('bb').textContent=bn.total;$('addb').checked=!!db.addb;
 if(document.activeElement!==$('steps'))$('steps').value=bn.st||'';
 $('eat').textContent=eat;$('tg').textContent=c?c.kcal:'--';
 const rem=c?c.kcal+(db.addb?bn.total:0)-eat:null;$('rem').textContent=c?Math.max(0,rem):'--';
 const pct=c?Math.min(100,Math.round(eat/c.kcal*100)):0;
 $('pct').textContent=pct+'%';$('arc').style.strokeDashoffset=314-314*pct/100;
 let a='';
 if(!c)a='<div class="alert g">⚙️ 設定タブで基本情報を入力してね</div>';
 else if(rem<0)a=`<div class="alert b">🚨 目標を ${-rem} kcal オーバー！次は軽めに</div>`;
 else if(rem<=300)a=`<div class="alert w">⚠️ あと ${rem} kcal でオーバー！気をつけて</div>`;
 else a=`<div class="alert g">✨ 今日はあと ${rem} kcal 食べられるよ</div>`;
 $('al').innerHTML=a;
 $('meals').innerHTML=ms.length?ms.map((m,i)=>`<div class="meal">${m.img?`<img src="${m.img}" alt="">`:'<div style="font-size:34px">🍽️</div>'}<div class="grow"><b>${esc(m.name)}</b><div class="sub">${m.kcal} kcal ・ ${m.time}${m.detail?'<br>'+esc(m.detail):''}</div></div><button class="btn bad sm" data-dm="${i}">削除</button></div>`).join(''):'<div class="sub">まだ記録がありません</div>';
 const dn=db.done[td()]||{};
 $('tt').innerHTML=db.tasks.length?db.tasks.map((t,i)=>`<label class="task ${dn[i]?'done':''}" style="margin:0"><input type="checkbox" data-ck="${i}" ${dn[i]?'checked':''}><span class="grow nm"><b>${esc(t.n)}</b> <span class="sub">${esc(t.g)}</span></span></label>`).join('')+`<div class="sub" style="margin-top:8px">達成 ${Object.values(dn).filter(Boolean).length}/${db.tasks.length}</div>`:'<div class="sub">課題タブで追加してね</div>';
 $('tl').innerHTML=db.tasks.map((t,i)=>`<div class="task"><div class="grow"><b>${esc(t.n)}</b> <span class="sub">${esc(t.g)}</span></div><button class="btn soft sm" data-et="${i}">編集</button><button class="btn bad sm" data-dt="${i}">削除</button></div>`).join('');
}
function advice(){
 const c=calc(),el=$('adv');if(!c){el.innerHTML='<div class="sub">入力して保存すると、1日の目標カロリーが出ます</div>';return}
 let h=`<h2>📊 あなたの目安</h2><div class="sub">${c.age}歳 ・ 基礎代謝 約${c.bmr} kcal ・ 消費 約${c.tdee} kcal/日</div>
 <div class="stat"><div><b>${c.kcal}</b>目標kcal/日</div><div><b>${c.days??'-'}</b>残り日数</div><div><b>${c.w>c.gw&&c.gw?(c.w-c.gw).toFixed(1):'-'}</b>減量kg</div></div>`;
 if(c.floored)h+=`<div class="alert w">⚠️ 目標日だと無理のあるペースです。安全のため下限 ${c.kcal} kcal に設定しました。${c.real?`このペースだと達成は約${c.real}日後が目安です。`:''}</div>`;
 else if(c.need>0)h+=`<div class="alert g">1日あたり約${c.need} kcal 減らすペースです</div>`;
 h+='<div class="note">体重1kg≒7,700kcalで計算した目安です。体調に合わせて調整し、持病のある方は医師に相談してください。</div>';
 el.innerHTML=h;
}
function load(){Object.keys(db.p).forEach(k=>{if($(k))$(k).value=db.p[k]});if(db.p.goalW)$('goalW').value=db.p.goalW;if(db.p.goalD)$('goalD').value=db.p.goalD;advice();render()}
$('sv').onclick=()=>{['birth','sex','height','weight','goalW','goalD','act'].forEach(k=>db.p[k]=$(k).value);save();advice();render();scrollTo(0,0)};


// おすすめプラン
function plan(){
 const c=calc();if(!c||!c.gw||c.gw>=c.w)return null;
 const wk=c.days?(c.w-c.gw)/(c.days/7):0,lv=c.need<300?0:c.need<600?1:2;
 const P=[
  [['散歩','20分'],['スクワット','10回'],['腕立て（膝つきOK）','5回'],['プランク','20秒'],['ストレッチ','5分'],['水を飲む','2L'],['寝る前2時間は食べない','']],
  [['ウォーキング','30分'],['スクワット','20回'],['腕立て','10回'],['プランク','1分'],['腹筋','15回'],['水を飲む','2L'],['野菜から先に食べる','']],
  [['ウォーキング','45分'],['スクワット','30回'],['腕立て','15回'],['プランク','1分30秒'],['腹筋','20回'],['階段を使う','5階分'],['水を飲む','2L'],['間食をしない','']]
 ];
 return{c,wk,lv,items:P[lv].map(([n,g])=>({n,g}))};
}
function renderRec(){
 const p=plan(),el=$('rec');
 if(!p){el.innerHTML='<div class="sub">設定タブで現在体重・目標体重・目標日を入力すると、プランが出ます</div>';return}
 const {c,wk,lv,items}=p,lvn=['ゆるめ','ふつう','しっかり'][lv];
 let h=`<div class="stat"><div><b>${wk?wk.toFixed(2):'-'}</b>kg/週</div><div><b>${c.kcal}</b>kcal/日</div><div><b>${lvn}</b>運動レベル</div></div>`;
 if(wk>1||c.floored)h+='<div class="alert w">⚠️ 減量ペースが速めです。目標日を延ばすのがおすすめです</div>';
 h+='<div class="note" style="margin:10px 0 4px">食事の目標kcalを守りつつ、次の課題で消費を上乗せします</div>';
 h+=items.map((t,i)=>`<div class="task"><div class="grow"><b>${esc(t.n)}</b> <span class="sub">${esc(t.g)}</span></div><button class="btn soft sm" data-ra="${i}">追加</button></div>`).join('');
 h+='<button class="btn full" data-rall="1" style="margin-top:12px">⭐ まとめて追加</button>';
 h+='<div class="note">目安のプランです。体調に合わせて調整し、持病のある方は医師に相談してください。</div>';
 el.innerHTML=h;
}
function addRec(t){if(db.tasks.length>=10||db.tasks.some(x=>x.n===t.n))return false;db.tasks.push({n:t.n,g:t.g});return true}


function setCol(c){document.documentElement.dataset.c=c;document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.col===c))}
document.addEventListener('click',e=>{const c=e.target.dataset&&e.target.dataset.col;if(c){db.col=c;save();setCol(c)}});
setCol(db.col||'pink');

// 消費カロリー
const WALK=/ウォーキング|散歩|ジョギング|ランニング|歩/;
function taskKcal(t,w){
 const g=t.g||'',n=t.n||'';
 if(/回/.test(g)){const k=parseFloat((g.match(/[\d.]+/)||[])[0]);if(!k)return 0;
  const per=/腕立|プッシュ/.test(n)?.5:/スクワット/.test(n)?.35:/腹筋/.test(n)?.3:.3;return k*per*w/70}
 const m=+((g.match(/([\d.]+)\s*分/)||[])[1]||0),sc=+((g.match(/([\d.]+)\s*秒/)||[])[1]||0),h=+((g.match(/([\d.]+)\s*時間/)||[])[1]||0);
 const min=m+sc/60+h*60;if(!min)return 0;
 const met=/ジョギング|ランニング|走/.test(n)?8:/縄跳び/.test(n)?10:/水泳|泳/.test(n)?7:/自転車|サイクリング/.test(n)?6:/ウォーキング|散歩|歩/.test(n)?3.5:/ヨガ|ストレッチ/.test(n)?2.5:/プランク|筋トレ|体操/.test(n)?3.5:3;
 return met*w*min/60;
}
function burn(c){
 const w=c?c.w:60,st=+(db.steps||{})[td()]||0,stepK=st*w*.00057,dn=db.done[td()]||{};
 let taskK=0;db.tasks.forEach((t,i)=>{if(dn[i]&&!(st>0&&WALK.test(t.n)))taskK+=taskKcal(t,w)});
 return{st,stepK:Math.round(stepK),taskK:Math.round(taskK),total:Math.round(stepK+taskK)};
}
$('steps').oninput=e=>{(db.steps=db.steps||{})[td()]=+e.target.value||0;save();render()};
$('addb').onchange=e=>{db.addb=e.target.checked;save();render()};

// 起動中の歩数カウント（加速度センサー）
let stepOn=false,sm=9.8,base=9.8,above=false,lastT=0,gotEv=false,wl=null,tm=null;
function onMotion(e){
 const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;gotEv=true;
 const m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);sm=sm*.7+m*.3;base=base*.99+sm*.01;
 const d=sm-base,now=Date.now();
 if(d>1.3&&!above&&now-lastT>300){above=true;lastT=now;(db.steps=db.steps||{})[td()]=(+db.steps[td()]||0)+1;$('steps').value=db.steps[td()];clearTimeout(tm);tm=setTimeout(()=>{save();render()},1000)}
 else if(d<.4)above=false;
}
async function stopStep(){stepOn=false;removeEventListener('devicemotion',onMotion);try{wl&&wl.release()}catch(e){}wl=null;save();$('stp').textContent='📲 歩数カウントを開始（アプリを開いている間）';$('sts').textContent=''}
$('stp').onclick=async()=>{
 if(stepOn)return stopStep();
 if(typeof DeviceMotionEvent==='undefined'){$('sts').textContent='この端末・ブラウザでは使えません。手入力してね';return}
 try{if(DeviceMotionEvent.requestPermission&&await DeviceMotionEvent.requestPermission()!=='granted'){$('sts').textContent='モーションの許可がありません。手入力してね';return}}catch(e){$('sts').textContent='許可できませんでした。手入力してね';return}
 gotEv=false;addEventListener('devicemotion',onMotion);stepOn=true;
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 $('stp').textContent='⏹ カウント停止';$('sts').textContent='カウント中…画面を点けたまま、ポケットやバッグに入れて歩いてね';
 setTimeout(()=>{if(stepOn&&!gotEv){stopStep();$('sts').textContent='センサーが使えませんでした（このビューでは非対応）。手入力してね'}},3000);
};
// tabs
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['home','task','set'].forEach(t=>$('t-'+t).classList.toggle('hide',t!==b.dataset.t));scrollTo(0,0)});

// tasks
$('ta').onclick=()=>{const n=$('tn').value.trim(),g=$('tgl').value.trim();if(!n)return;if(db.tasks.length>=10){alert('課題は10個までです');return}db.tasks.push({n,g});$('tn').value=$('tgl').value='';save();render()};
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.dataset.dt!==undefined){if(confirm('削除しますか？')){db.tasks.splice(+t.dataset.dt,1);db.done[td()]={};save();render()}}
 if(t.dataset.et!==undefined){const i=+t.dataset.et,n=prompt('課題名',db.tasks[i].n);if(n===null)return;const g=prompt('目標（例：20回）',db.tasks[i].g);if(g===null)return;db.tasks[i]={n:n.trim()||db.tasks[i].n,g};save();render()}
 if(t.dataset.ra!==undefined){const p=plan();if(p&&!addRec(p.items[+t.dataset.ra]))alert('追加できません（10個まで・同名は不可）');save();render()}
 if(t.dataset.rall){const p=plan();if(p){p.items.forEach(addRec);save();render()}}
 if(t.dataset.dm!==undefined){db.meals[td()].splice(+t.dataset.dm,1);save();render()}
});
document.addEventListener('change',e=>{if(e.target.dataset.ck!==undefined){const d=db.done[td()]=db.done[td()]||{};d[e.target.dataset.ck]=e.target.checked;save();render()}});

// meals
function thumb(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,150/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)})}
function addMeal(name,kcal,detail,img){const k=td();(db.meals[k]=db.meals[k]||[]).push({name,kcal:Math.round(kcal),detail:detail||'',img:img||'',time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});save();render()}
$('ph').onchange=e=>{file=e.target.files[0]||null;if(file){$('pv').src=URL.createObjectURL(file);$('pv').style.display='block'}};
$('an').onclick=async()=>{
 if(!file){$('msg').textContent='先に写真を選んでね📸';return}
 if(!sample){$('msg').textContent='AI解析が使えないので手入力してね';$('manual').classList.remove('hide');return}
 $('an').disabled=true;$('msg').textContent='🔍 解析中…';
 try{
  const r=await sample.json('添付は1食分の食事写真です。写っている料理と量を推定し、合計カロリーを見積もってください。JSONのみで答えてください: {"name":"料理名(日本語・短く)","kcal":整数,"detail":"内訳と量の根拠を1文で"}',{images:[file],modelTier:'quick'});
  const k=Number(r.kcal);if(!r.name||!(k>0))throw{code:'bad'};
  addMeal(r.name,k,r.detail,await thumb(file));
  $('msg').textContent=`✅ ${r.name} 約${Math.round(k)} kcal を追加。目安なので必要なら削除して手入力してね`;
  file=null;$('pv').style.display='none';$('ph').value='';
 }catch(e){$('msg').textContent='解析できませんでした。手入力してね';$('manual').classList.remove('hide')}
 $('an').disabled=false;
};
$('madd').onclick=async()=>{const n=$('mn').value.trim(),k=+$('mk').value;if(!n||!(k>0))return;addMeal(n,k,'',file?await thumb(file):'');$('mn').value=$('mk').value='';};

(async()=>{
 load();
 try{const s=window.claude&&await claude.use('sample');if(s){const l=await s.limits().catch(()=>null);if(l&&l.images)sample=s}}catch(e){}
 if(!sample)$('manual').classList.remove('hide');
})();
</script>
</body>
</html>
